<body>
    <h1>Welcome to the Bookstore</h1>
    <div class="box">
    <div class="box3">
                <div class="logo"><img width="20" height="20" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmQ0HjjuNHpmiGlpEIA-vO7WBwmOT5Hid-2PUTg-7TjA&s=10" alt="G.L. BAJAJ" class="image",">G.L. BAJAJ</div>
                <div class="name">Website Name</div>
                <div class="home"><a href="index.html">Home</a></div>
                <div class="login">
                    <a href="login.html" target="contentFrame">Login</a>
                </div>
                <div class="registration">
                     <a href="registration.html" target="contentFrame">Registration</a>
                </div>
                <div class="catalogue">
                    <a href="catalogue.html" target="contentFrame">Catalogue</a>
                </div>
                <div class="cart">
                    <a href="cart.html" target="contentFrame">Cart</a>
                </div>
                <div class="branches">
                    <button onclick="openPage('catalogue.html')">All Books</button>
                    <button onclick="openPage('cse.html')">CSE</button>
                    <button onclick="openPage('ece.html')">ECE</button>
                    <button onclick="openPage('eee.html')">EEE</button>
                    <button onclick="openPage('civil.html')">CIVIL</button>
                </div>
                <div class="Description">
                    <iframe id="contentFrame" name="contentFrame" src="description.html" width="100%" height="100" style="border: none;">
                    </iframe>
                </div>
        </div>
    </div>
    <script>
        
const frame = document.getElementById("contentFrame");

// Open pages inside the description box
function openPage(page) {
    frame.src = page;
}

// Adjust the description box whenever a page loads
frame.addEventListener("load", function () {
    try {
        const doc = frame.contentDocument;

        if (!doc || !doc.body) {
            frame.style.height = "400px";
            return;
        }

        // Reset the old height
        frame.style.height = "0px";

        requestAnimationFrame(function () {
            const newHeight = Math.max(
                doc.body.scrollHeight,
                doc.documentElement.scrollHeight
            );

            frame.style.height = newHeight + "px";
        });

    } catch (error) {
        frame.style.height = "400px";
    }
});

    </script>
</body>
