<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration page</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <h2>Registration Page</h2>
    <div class="row1">
        <label>Name:</label>
        <input type="text">
    </div>
    <div class="row2">
        <label>Password:</label>
        <input type="text">
    </div>
    <div class="row3">
        <label>E-mail Id:</label>
        <input type="text">
    </div>
    <div class="row4">
        <label>Phone Number:</label>
        <input type="text">
    </div>
    <div class="row5">
        <label>Sex:</label>
        <input type="text">
    </div>
    <div class="row6">
        <label>Date of Birth:</label>
        <input type="text">
    </div>
    <div class="row8">
        <label>Address:</label>
        <input type="text">
    </div>
    <div class="row7">
        <label>Languages known:</label>
        <button type="submit">English</button>
        <button type="submit">Telugu</button>
        <button type="submit">Hindi</button>
        <button type="submit">Tamil</button>
    </div>
</body>
</html>
