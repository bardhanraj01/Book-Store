
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="registration.css">
    <script src="../js/registration.js" defer></script>
</head>
<body>

    <h2>Registration Page</h2>

    <form id="registrationForm">

        <div class="row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>
        </div>

        <div class="row">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" minlength="8" required>
        </div>

        <div class="row">
            <label for="email">E-mail ID:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="row">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="10-digit mobile number"
                   pattern="[0-9]{10}" maxlength="10" required>
        </div>

        <div class="row">
            <label>Sex:</label>
            <label class="option">
                <input type="radio" name="sex" value="Male" required> Male
            </label>
            <label class="option">
                <input type="radio" name="sex" value="Female"> Female
            </label>
            <label class="option">
                <input type="radio" name="sex" value="Other"> Other
            </label>
        </div>

        <div class="row">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <div class="row">
            <label for="address">Address:</label>
            <textarea id="address" name="address"
                      placeholder="Enter your address" required></textarea>
        </div>

        <div class="row">
            <label>Languages known:</label>
            <label class="option">
                <input type="checkbox" name="languages" value="English"> English
            </label>
            <label class="option">
                <input type="checkbox" name="languages" value="Telugu"> Telugu
            </label>
            <label class="option">
                <input type="checkbox" name="languages" value="Hindi"> Hindi
            </label>
            <label class="option">
                <input type="checkbox" name="languages" value="Tamil"> Tamil
            </label>
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
        </div>

        <p id="message" role="status"></p>

    </form>

</body>
</html>
